name: Release main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options: [patch, minor, major, none]
        default: patch
      publish:
        description: Publish a GitHub Release (unchecked builds and verifies an artifact only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v

      - name: Extract the Python 2.7 compiler
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'python-2.7.18.amd64.msi'
          $extracted = Join-Path $env:RUNNER_TEMP 'python27'
          $uri = 'https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi'
          $expected = 'B74A3AFA1E0BF2A6FC566A7B70D15C9BFABBA3756FB077797D16FFFA27800C05'
          Invoke-WebRequest -Uri $uri -OutFile $msi
          if ((Get-FileHash -LiteralPath $msi).Hash -ne $expected) {
              throw 'The Python 2.7 installer checksum does not match.'
          }
          $extract = Start-Process -FilePath msiexec.exe -WindowStyle Hidden -PassThru -Wait `
              -ArgumentList ('/a "{0}" /qn TARGETDIR="{1}"' -f $msi, $extracted)
          if ($extract.ExitCode -ne 0) {
              throw "Python 2.7 extraction failed with exit code $($extract.ExitCode)."
          }
          $dll = Get-ChildItem -LiteralPath $extracted -Recurse -Filter python27.dll -File |
              Select-Object -First 1
          if (-not $dll) { throw 'The Python 2.7 installer did not contain python27.dll.' }
          $gameRoot = Join-Path $env:RUNNER_TEMP 'tankmate-build'
          $runtime = New-Item -Path (Join-Path $gameRoot 'win64') -ItemType Directory -Force
          Copy-Item -LiteralPath $dll.FullName -Destination $runtime.FullName
          "TANKMATE_GAME_ROOT=$gameRoot" >> $env:GITHUB_ENV

      - name: Build and verify the mod
        id: package
        shell: pwsh
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          if (-not (Select-String -LiteralPath 'probe/mod_tankmate_signal.py' -Quiet `
              -Pattern '^_SHOW_TEST_NOTIFICATION = False$')) {
              throw 'Disable the test notification before building a release.'
          }
          $version = python -B tools/release_version.py $env:RELEASE_BUMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Build-AndInstall.ps1 -GameRoot $env:TANKMATE_GAME_ROOT -PackageOnly
          $built = python -B -c "from tools.verify_package import verify_package; print(verify_package('probe/tankmate-signal.wotmod'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($built -cne $version) { throw 'The mod version does not match VERSION.' }
          Write-Host "Verified Tankmate Signal $version"
          "tag=v$version" >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash -LiteralPath 'probe/tankmate-signal.wotmod').Hash.ToLowerInvariant()
          $checksum = Join-Path (Get-Location) 'probe/SHA256SUMS.txt'
          [IO.File]::WriteAllText($checksum, "$hash  tankmate-signal.wotmod`n")

      - uses: actions/upload-artifact@v7
        with:
          name: tankmate-signal-${{ steps.package.outputs.tag }}
          path: |
            probe/tankmate-signal.wotmod
            probe/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: tankmate-signal-${{ needs.build.outputs.tag }}
          path: release-build
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          (cd release-build && sha256sum --check SHA256SUMS.txt)
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'main advanced during the build. Start the release workflow again.' >&2
            exit 1
          fi
          printf '%s\n' "${RELEASE_TAG#v}" > VERSION
          if ! git diff --quiet -- VERSION; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "Release $RELEASE_TAG"
          fi
          existing=$(git ls-remote --refs --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$existing" ]]; then
            if [[ "${existing%%$'\t'*}" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $RELEASE_TAG already refers to a different commit." >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" release-build/tankmate-signal.wotmod release-build/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Tankmate Signal $RELEASE_TAG" --generate-notes
